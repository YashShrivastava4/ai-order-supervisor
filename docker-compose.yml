services:
  postgres:
    image: postgres:16
    container_name: order-supervisor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_supervisor
    ports:
      - "5433:5432"   # host:container — 5433 on the host to avoid colliding with
                       # whatever else is already bound to 5432 on this machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
